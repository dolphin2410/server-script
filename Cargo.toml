[package]
name = "server-script"
version = "2.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
follow-redirects = { git = "https://github.com/stevenroose/rust-follow-redirects/", branch = "update-deps" }

clap = { version = "3.2.25", features = ["derive"] } # CLI

regex = "1.12.3"     # Regex
flate2 = "1.1.9"   # Tar
tar = "0.4.45"      # Tar
chrono = "0.4.44"
anyhow = "1.0.102"
itertools = "0.14.0"
requestty = "0.6.3"
local-ip-address = "0.6.10"
bytes = "1.11.1"
termcolor = "1.4.1"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.50.0", features = ["full"] }
hyper-tls = "0.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.43.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Console"] }
